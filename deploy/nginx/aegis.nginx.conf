# ═══════════════════════════════════════════════════════════
# Aegis 标准 nginx 交付配置
# 放置: /etc/nginx/sites-available/aegis (ln -s 到 sites-enabled)
# 前置: 证书 /etc/nginx/ssl/tx.yjiod.com.{crt,key}
#       (Let's Encrypt; 可从 Caddy 存储复制或用 certbot 申请)
#
# 路由:
#   443 TLS  -> wrangler console (127.0.0.1:8787)
#   /aegis/  -> Collector (127.0.0.1:8931), 剥离 /aegis 前缀
#   80       -> 301 https (注意: 未备案域名 80 端口可能被云厂商拦截,
#               此时用户直接走 https:// 即可)
#
# 关键: proxy_set_header X-Forwarded-Proto https
#   控制台 /api/auth/providers 依赖它构建 https 的 SSO redirect_uri
#   (TLS 在 nginx 终止, 后端 worker 看到的 origin 是 http)
#
# 关键: 缓存策略
#   HTML/路由/API 一律 no-store。否则浏览器启发式缓存旧 HTML + immutable 旧 JS,
#   部署后页面表现"没更新/仍是旧文案"。仅内容哈希的 /_next/static/ 可 immutable
#   长缓存(文件名带哈希, 内容变则文件名变, 不会读到旧文件)。
# ═══════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name tx.yjiod.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tx.yjiod.com;

    ssl_certificate     /etc/nginx/ssl/tx.yjiod.com.crt;
    ssl_certificate_key /etc/nginx/ssl/tx.yjiod.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Collector direct API (strip /aegis prefix)
    location /aegis/ {
        proxy_pass http://127.0.0.1:8931/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 内容哈希静态资源: immutable 长缓存(文件名带哈希)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Console (vinext/wrangler on 8787): HTML/路由/API 永不缓存
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
}

# ─── 可选: IP-based HTTPS (UAC UAT 回跳走 443) ───────────────
# 未备案域名 80 端口被云厂商拦截时, UAC 回跳可改用 https://<公网IP>。
# 需自签 IP 证书 (SAN IP:<ip>):
#   openssl req -x509 -nodes -newkey rsa:2048 -days 825 \
#     -keyout /etc/nginx/ssl/ip.key -out /etc/nginx/ssl/ip.crt \
#     -subj "/CN=<ip>" -addext "subjectAltName=IP:<ip>"
# 浏览器首次访问 https://<ip> 会提示自签证书, 点"继续访问"即可 (UAT 测试可接受)。
# server {
#     listen 443 ssl;
#     server_name <公网IP>;
#     ssl_certificate     /etc/nginx/ssl/ip.crt;
#     ssl_certificate_key /etc/nginx/ssl/ip.key;
#     location /aegis/ { proxy_pass http://127.0.0.1:8931/; proxy_set_header X-Forwarded-Proto https; }
#     location / { proxy_pass http://127.0.0.1:8787; proxy_set_header X-Forwarded-Proto https; }
# }
# 并设 AEGIS_UAC_REDIRECT_BASE=https://<公网IP>

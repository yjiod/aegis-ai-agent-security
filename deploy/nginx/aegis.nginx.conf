# ═══════════════════════════════════════════════════════════
# Aegis 标准 nginx 交付配置
# 放置: /etc/nginx/sites-available/aegis (ln -s 到 sites-enabled)
# 前置: 证书 /etc/nginx/ssl/tx.yjiod.com.{crt,key}
#       (Let's Encrypt; 可从 Caddy 存储复制或用 certbot 申请)
#
# 路由:
#   443 TLS  -> wrangler console (127.0.0.1:8787)
#   /aegis/  -> Collector (127.0.0.1:8931), 剥离 /aegis 前缀
#   80       -> 301 https (注意: 未备案域名 80 端口可能被云厂商拦截,
#               此时用户直接走 https:// 即可)
#
# 关键: proxy_set_header X-Forwarded-Proto https
#   控制台 /api/auth/providers 依赖它构建 https 的 SSO redirect_uri
#   (TLS 在 nginx 终止, 后端 worker 看到的 origin 是 http)
# ═══════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name tx.yjiod.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tx.yjiod.com;

    ssl_certificate     /etc/nginx/ssl/tx.yjiod.com.crt;
    ssl_certificate_key /etc/nginx/ssl/tx.yjiod.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Collector direct API (strip /aegis prefix)
    location /aegis/ {
        proxy_pass http://127.0.0.1:8931/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Console (vinext/wrangler on 8787)
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

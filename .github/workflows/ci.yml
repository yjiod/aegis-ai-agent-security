name: security-release-gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONWARNINGS: error::ResourceWarning
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.13.0'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: python3 -m unittest discover -s tests -v
      - run: |
          for file in public/downloads/*.sh scripts/*.sh; do sh -n "$file"; done
      - run: npm run build
      - run: python3 public/downloads/aegis_release_verify.py public/downloads
      - run: npm run lint
      - run: npx tsc --noEmit

  dev-experience:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.13.0'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Start collector and seed demo reports
        run: ./scripts/dev-collector.sh
      - name: Verify collector health and seeded fleet
        run: |
          curl -fsS http://127.0.0.1:8931/health
          echo
          . .dev/collector.env
          curl -fsS -H "Authorization: Bearer $AEGIS_COLLECTOR_TOKEN" \
            http://127.0.0.1:8931/v1/summary | tee /tmp/collector-summary.json
          echo
          python3 -c 'import json; summary=json.load(open("/tmp/collector-summary.json")); assert summary["total_devices"] >= 5, summary'
      - name: Start console dev server in background
        run: |
          nohup npm run dev > /tmp/aegis-dev-server.log 2>&1 &
          echo $! > /tmp/aegis-dev-server.pid
          attempts=0
          until curl -fsS -o /dev/null http://127.0.0.1:3000/ 2>/dev/null; do
            attempts=$((attempts + 1))
            if [ "$attempts" -ge 90 ]; then
              echo "dev server did not become ready within 180s" >&2
              tail -n 100 /tmp/aegis-dev-server.log >&2
              exit 1
            fi
            sleep 2
          done
          echo "dev server is ready"
      - name: Verify console responds with 200
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)
          echo "console HTTP status: $status"
          [ "$status" = "200" ]
      - name: Verify collector connection through /api/summary
        run: |
          curl -fsS http://127.0.0.1:3000/api/summary | tee /tmp/aegis-api-summary.json
          echo
          grep -q '"connected":true' /tmp/aegis-api-summary.json
      - name: Stop background processes
        if: always()
        run: |
          ./scripts/dev-collector.sh --stop || true
          if [ -f /tmp/aegis-dev-server.pid ]; then
            kill "$(cat /tmp/aegis-dev-server.pid)" 2>/dev/null || true
          fi

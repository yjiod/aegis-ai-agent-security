name: security-release-gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONWARNINGS: error::ResourceWarning
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.13.0'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: python3 -m unittest discover -s tests -v
      - run: |
          for file in public/downloads/*.sh scripts/*.sh; do sh -n "$file"; done
      - run: npm run build
      - run: python3 public/downloads/aegis_release_verify.py public/downloads
      - run: npm run lint
      - run: npx tsc --noEmit

  dev-experience:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.13.0'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      # run-e2e.sh 自带 Collector / dev server 生命周期与清理 trap，并先做"已认证
      # /api/summary"连通探针。旧的未认证 curl 会被会话中间件 307 到 /login（返回
      # HTML），grep connected:true 永远失败——该探针已随鉴权网关上线而失效，故移除。
      - name: Demo-mode full e2e (console UI + API + policy + rbac, no collector)
        run: ./scripts/run-e2e.sh
      - name: Live-mode e2e (real seeded collector; version-posture single source)
        run: ./scripts/run-e2e.sh --live e2e/policy.spec.ts e2e/api.spec.ts


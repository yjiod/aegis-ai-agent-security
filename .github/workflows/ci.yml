name: security-release-gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONWARNINGS: error::ResourceWarning
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.13.0'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: python3 -m unittest discover -s tests -v
      - run: |
          for file in public/downloads/*.sh; do sh -n "$file"; done
      - run: npm run build
      - run: python3 public/downloads/sentinel_release_verify.py public/downloads

  windows-powershell:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Parse every Windows PowerShell script with Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem public/downloads -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $failed = $true
              $parseErrors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }
      - name: Run isolated endpoint Agent smoke tests with Windows PowerShell 5.1
        shell: powershell
        run: tests/windows-agent-smoke.ps1

  macos-shell:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Parse every endpoint shell script on macOS
        shell: bash
        run: |
          for file in public/downloads/*.sh; do /bin/bash -n "$file"; /bin/sh -n "$file"; done
      - name: Run isolated installer and Agent smoke tests on macOS
        shell: bash
        run: /bin/sh tests/macos-agent-smoke.sh

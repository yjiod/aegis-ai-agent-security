name: macos-package-lifecycle

on:
  pull_request:
    paths:
      - 'clients/macos/**'
      - public/downloads/aegis_macos_desktop_status.py
      - tests/test_macos_desktop_status.py
      - public/downloads/aegis_macos_lifecycle.py
      - tests/test_macos_lifecycle.py
      - public/downloads/aegis_macos_runtime_activation.py
      - tests/test_macos_runtime_activation.py
      - public/downloads/aegis_macos_user_retirement.py
      - tests/test_macos_user_retirement.py
      - public/downloads/retire-aegis-user-macos.sh
      - scripts/build-macos-standalone.sh
      - public/downloads/aegis_macos_enrollment.py
      - public/downloads/aegis_macos_service_migration.py
      - tests/test_macos_service_migration.py
      - tests/test_macos_enrollment.py
      - tests/test_macos_migration.py
      - scripts/build-macos-pkg.sh
      - public/downloads/aegis_agent.py
      - public/downloads/aegis_self_update.py
      - public/downloads/aegis-policy.json
      - public/downloads/aegis_macos_maintenance.py
      - public/downloads/uninstall-aegis-macos.sh
      - public/downloads/MACOS-UNINSTALL.md
      - public/downloads/rollback-aegis-macos.sh
      - tests/test_macos_package_rollback.py
      - public/downloads/mdm-macos-install.sh
      - public/downloads/aegis-install-macos-oneclick.sh
      - public/downloads/aegis-agent-macos-enroll.sh
      - public/downloads/aegis_release_build.py
      - public/downloads/aegis_release_verify.py
      - tests/test_macos_mdm_install.py
      - tests/test_macos_package.py
      - tests/test_macos_maintenance.py
      - tests/test_macos_diagnostics.py
      - public/downloads/aegis_macos_configuration.py
      - public/downloads/aegis-configure-macos.sh
      - tests/test_macos_configuration.py
      - public/downloads/aegis_macos_diagnostics.py
      - public/downloads/mdm-macos-compliance.sh
      - tests/test_macos_native_maintenance.py
      - tests/test_watch_lifecycle.py
      - .github/workflows/macos-package.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-fixtures:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Build and expand real packages; run isolated lifecycle fixtures
        run: python3 -m unittest discover -s tests -p test_macos_package.py -v
      - name: Validate uninstall files and a real isolated system launchd process
        run: sudo env AEGIS_RUN_LAUNCHD_TESTS=1 "$(command -v python3)" -m unittest discover -s tests -p test_macos_maintenance.py -v
      - name: Validate watch shutdown and system launchd child-group cleanup
        run: sudo env AEGIS_RUN_LAUNCHD_TESTS=1 "$(command -v python3)" -m unittest discover -s tests -p test_watch_lifecycle.py -v
      - name: Validate embedded maintenance dispatch and trusted uninstall wrapper
        run: python3 -m unittest discover -s tests -p test_macos_native_maintenance.py -v
      - name: Validate diagnostics with synthetic state
        run: python3 -m unittest discover -s tests -p test_macos_diagnostics.py -v
      - name: Validate native configuration boundaries
        run: python3 -m unittest discover -s tests -p test_macos_configuration.py -v
      - name: Validate native MDM trust gates with isolated Installer and real unsigned rejection
        run: python3 -m unittest discover -s tests -p test_macos_mdm_install.py -v
      - name: Validate native enrollment contract and state preservation
        run: python3 -m unittest discover -s tests -p test_macos_enrollment.py -v
      - name: Validate protected runtime migration
        run: python3 -m unittest discover -s tests -p test_macos_migration.py -v
      - name: Validate legacy service preparation and recovery
        run: python3 -m unittest discover -s tests -p test_macos_service_migration.py -v

      - name: Validate Swift status reader against a synthetic publisher snapshot
        run: |
          mkdir -m 700 "$RUNNER_TEMP/aegis-desktop-fixture"
          AEGIS_TEST_DESKTOP_DIR="$RUNNER_TEMP/aegis-desktop-fixture" python3 - <<'PYCODE'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'public/downloads')
          import aegis_macos_desktop_status as desktop
          app = Path(os.environ['AEGIS_TEST_DESKTOP_DIR']).resolve()
          health = {source: True for source in desktop.CHECKS.values()}
          health['AegisPolicyVersion'] = '1.2.3'
          desktop.publish(app, desktop.snapshot(health, '0.37.3', 1800000000), owner=os.getuid())
          PYCODE
          AEGIS_TEST_DESKTOP_SNAPSHOT="$RUNNER_TEMP/aegis-desktop-fixture/desktop-status.json" \
            swift test --package-path clients/macos --scratch-path "$RUNNER_TEMP/aegis-swift-tests"
      - name: Validate redacted desktop snapshot publication
        run: python3 -m unittest discover -s tests -p test_macos_desktop_status.py -v
      - name: Validate shared Mac maintenance serialization
        run: python3 -m unittest discover -s tests -p test_macos_lifecycle.py -v
      - name: Validate native runtime replacement and recovery
        run: python3 -m unittest discover -s tests -p test_macos_runtime_activation.py -v
      - name: Validate current-user retirement and historical launcher
        run: python3 -m unittest discover -s tests -p test_macos_user_retirement.py -v

      - name: Validate trusted native package rollback entry
        run: python3 -m unittest discover -s tests -p test_macos_package_rollback.py -v

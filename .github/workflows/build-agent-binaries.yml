name: build-agent-binaries

# 去-python 化 B-Phase2：把纯 stdlib 的 aegis_agent.py 冻结成自包含原生二进制，让没有 python 的
# mac 也能被管理。产物 aegis-agent-darwin-<arch> 命名与 aegis_agent.self_update_binary_artifact_name()
# 一致，供 release manifest 收录 + 冻结 agent 后台热更(sys.executable 自替换)取用。Linux 暂不做。
#
# 架构策略（重要）：PyInstaller 不能跨架构编译。**不用 GH 的 macos-13(Intel) runner——它正在被
# 弃用、实测排队 7min+ 不起（Intel mac runner 稀缺）**。改为全部在 macos-14(Apple Silicon, 供给
# 充足、起得快) 上构建：arm64 用原生 python；x64 用 setup-python 的 architecture:x64（在 Rosetta 下
# 运行的 x86_64 python）跑 PyInstaller，产出 x86_64 二进制。两个架构同一 runner、都快。
#
# 触发：手动(workflow_dispatch) + 打 tag(v*)。产物经 upload-artifact 取出，Phase3/5 由发布流程放进
# public/downloads/ → aegis_release_build.py 收录 sha256 进 manifest → 部署直供 + 嵌入 .pkg/.run。

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  freeze:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            pyarch: arm64
          - arch: x64
            pyarch: x64
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Ensure Rosetta 2 (x64 python/二进制在 arm64 runner 上运行需要；幂等)
        run: softwareupdate --install-rosetta --agree-to-license || true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          architecture: ${{ matrix.pyarch }}
      - name: Confirm interpreter arch matches target
        run: python -c "import platform,sys;print('py arch =',platform.machine());assert platform.machine()=='arm64' if '${{ matrix.arch }}'=='arm64' else platform.machine()=='x86_64','wrong interpreter arch'"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Freeze agent (--onefile, self-contained)
        run: |
          python -m PyInstaller --onefile --name "aegis-agent-darwin-${{ matrix.arch }}" \
            --hidden-import aegis_self_update \
            --paths public/downloads \
            --distpath dist-bin --workpath build-bin --specpath build-bin \
            public/downloads/aegis_agent.py
      - name: Verify arch + self-contained (no system libpython linkage)
        run: |
          BIN="dist-bin/aegis-agent-darwin-${{ matrix.arch }}"
          file "$BIN"
          WANT=$( [ "${{ matrix.arch }}" = arm64 ] && echo arm64 || echo x86_64 )
          file "$BIN" | grep -q "$WANT" || { echo "FAIL: not a $WANT binary"; exit 1; }
          if otool -L "$BIN" | grep -qi 'libpython\|Python.framework'; then echo "FAIL: links system python"; otool -L "$BIN"; exit 1; fi
          echo "self-contained $WANT OK"; ls -lh "$BIN"
      - name: Smoke test frozen binary (runs WITHOUT system python; finds sibling policy via BASE_DIR)
        run: |
          set -e
          mkdir -p /tmp/agempty /tmp/agout
          cp public/downloads/aegis-policy.json public/downloads/aegis-security-baseline.md dist-bin/
          BIN="dist-bin/aegis-agent-darwin-${{ matrix.arch }}"
          set +e; "$BIN" /tmp/agempty --policy dist-bin/aegis-policy.json --output /tmp/agout/report.json; rc=$?; set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then echo "smoke FAIL rc=$rc"; exit 1; fi
          python -c "import json;r=json.load(open('/tmp/agout/report.json'));assert r['schema']=='aegis.report/v1';assert r['policy_version'],'policy sibling not found via BASE_DIR';print('smoke OK: agent_version',r['agent_version'],'policy_version',r['policy_version'])"
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegis-agent-darwin-${{ matrix.arch }}
          path: dist-bin/aegis-agent-darwin-${{ matrix.arch }}
          if-no-files-found: error

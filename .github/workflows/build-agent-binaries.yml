name: build-agent-binaries

# 去-python 化 B-Phase2：把纯 stdlib 的 aegis_agent.py 冻结成自包含原生二进制，让没有 python 的
# mac 也能被管理。产物 aegis-agent-darwin-<arch> 命名与 aegis_agent.self_update_binary_artifact_name()
# 一致，供 release manifest 收录 + 冻结 agent 后台热更(sys.executable 自替换)取用。Linux 暂不做。
#
# Both architectures build and execute on native GitHub runners. The final package,
# signing, privileged lifecycle and clean-machine acceptance remain separate gates.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - public/downloads/aegis_macos_enrollment.py
      - tests/test_macos_enrollment.py
      - tests/test_macos_migration.py
      - public/downloads/aegis_agent.py
      - public/downloads/aegis_self_update.py
      - public/downloads/aegis_macos_maintenance.py
      - public/downloads/aegis_macos_configuration.py
      - public/downloads/aegis-configure-macos.sh
      - tests/test_macos_configuration.py
      - public/downloads/aegis_macos_diagnostics.py
      - public/downloads/mdm-macos-compliance.sh
      - tests/test_macos_diagnostics.py
      - tests/test_macos_native_maintenance.py
      - tests/test_macos_frozen_package.py
      - tests/test_self_update_robustness.py
      - scripts/build-macos-pkg.sh
      - scripts/macos-freeze-requirements.txt
      - .github/workflows/build-agent-binaries.yml
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  freeze:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.7'
          architecture: ${{ matrix.arch }}
      - name: Verify native interpreter and install locked freeze toolchain
        run: |
          python3 -c 'import platform; expected={"arm64":"arm64", "x64":"x86_64"}["${{ matrix.arch }}"]; assert platform.machine()==expected'
          python3 -m pip install --only-binary=:all: --require-hashes -r scripts/macos-freeze-requirements.txt
          python3 -m pip check
      - name: Freeze agent (--onefile, self-contained)
        run: |
          python3 -m PyInstaller --onefile --name "aegis-agent-darwin-${{ matrix.arch }}" \
            --hidden-import aegis_self_update --hidden-import aegis_macos_maintenance --hidden-import aegis_macos_diagnostics --hidden-import aegis_macos_configuration --hidden-import aegis_macos_enrollment \
            --paths public/downloads \
            --distpath dist-bin --workpath build-bin --specpath build-bin \
            public/downloads/aegis_agent.py
      - name: Verify arch + self-contained (no system libpython linkage)
        run: |
          BIN="dist-bin/aegis-agent-darwin-${{ matrix.arch }}"
          WANT=$( [ "${{ matrix.arch }}" = "arm64" ] && echo arm64 || echo x86_64 )
          file "$BIN"
          file "$BIN" | grep -q "$WANT" || { echo "FAIL: not a $WANT binary"; exit 1; }
          if otool -L "$BIN" | grep -qi 'libpython\|Python.framework'; then echo "FAIL: links system python"; otool -L "$BIN"; exit 1; fi
          echo "self-contained $WANT OK"; ls -lh "$BIN"
      - name: Test frozen maintenance and rejection paths with hostile external Python environment
        run: |
          AEGIS_FROZEN_AGENT="$PWD/dist-bin/aegis-agent-darwin-${{ matrix.arch }}" \
            python3 -m unittest discover -s tests -p test_macos_native_maintenance.py -v
      - name: Validate update preflight against the frozen candidate
        run: |
          AEGIS_FROZEN_AGENT="$PWD/dist-bin/aegis-agent-darwin-${{ matrix.arch }}" \
            python3 -m unittest discover -s tests -p test_self_update_robustness.py -v
      - name: Validate native diagnostics against root-owned synthetic installation
        run: |
          sudo env AEGIS_FROZEN_AGENT="$PWD/dist-bin/aegis-agent-darwin-${{ matrix.arch }}" \
            "$(command -v python3)" -m unittest discover -s tests -p test_macos_diagnostics.py -v
      - name: Validate embedded configuration in root-owned synthetic installation
        run: |
          sudo env AEGIS_FROZEN_AGENT="$PWD/dist-bin/aegis-agent-darwin-${{ matrix.arch }}" \
            "$(command -v python3)" -m unittest discover -s tests -p test_macos_configuration.py -v
      - name: Validate native enrollment with synthetic state and no network
        run: |
          sudo env AEGIS_FROZEN_AGENT="$PWD/dist-bin/aegis-agent-darwin-${{ matrix.arch }}" \
            "$(command -v python3)" -m unittest discover -s tests -p test_macos_enrollment.py -v
      - name: Validate protected migration as the system owner
        run: |
          sudo "$(command -v python3)" -m unittest discover -s tests -p test_macos_migration.py -v
      - name: Upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aegis-agent-darwin-${{ matrix.arch }}
          path: dist-bin/aegis-agent-darwin-${{ matrix.arch }}
          if-no-files-found: error
      # ES AUTH_EXEC 执行级封禁守护: 编译即产物; 未签名/未授权(entitlement)时运行自退(exit 2),
      # 终端回退 chmod exec-deny。entitlement+签名到位后由 LaunchDaemon 点亮。
      - name: Build ES AUTH_EXEC guard (inert without entitlement)
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then TRIPLE=arm64-apple-macos12; else TRIPLE=x86_64-apple-macos12; fi
          swiftc -O -target "$TRIPLE" -lEndpointSecurity -o dist-bin/aegis-exec-guard-darwin-${{ matrix.arch }} client/es-guard/AegisExecGuard.swift || echo "guard build skipped (SDK/entitlement)"
      - name: Upload ES guard artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aegis-exec-guard-darwin-${{ matrix.arch }}
          path: dist-bin/aegis-exec-guard-darwin-${{ matrix.arch }}
          if-no-files-found: ignore

  native-package:
    needs: freeze
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.7'
      - name: Retrieve both frozen artifacts from this exact workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/aegis-package-binaries"
          for arch in arm64 x64; do
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "aegis-agent-darwin-$arch" --dir "$RUNNER_TEMP/aegis-package-binaries"
          done
      - name: Validate actual package payload and isolated postinstall
        run: |
          AEGIS_MACOS_PACKAGE_BIN_DIR="$RUNNER_TEMP/aegis-package-binaries" \
            python3 -m unittest discover -s tests -p test_macos_frozen_package.py -v
      - name: Build unsigned candidate package with a synthetic server address
        env:
          AEGIS_PUBLIC_ORIGIN: https://aegis.example.test
        run: |
          cp "$RUNNER_TEMP/aegis-package-binaries/"aegis-agent-darwin-* public/downloads/
          sh scripts/build-macos-pkg.sh
      - name: Retain candidate package for review (not a signed release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aegis-macos-pkg-candidate-${{ matrix.runner }}
          path: public/downloads/aegis-agent-macos.pkg
          if-no-files-found: error

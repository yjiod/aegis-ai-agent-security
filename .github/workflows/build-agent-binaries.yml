name: build-agent-binaries

# 去-python 化 B-Phase2：把纯 stdlib 的 aegis_agent.py 冻结成自包含原生二进制，让没有 python 的
# mac 也能被管理。PyInstaller/Nuitka 不能跨平台/跨架构编译，故用矩阵在各架构 runner 上各自冻结：
#   macos-14 → darwin-arm64（Apple Silicon）    macos-13 → darwin-x64（Intel）
# 产物 aegis-agent-darwin-<arch> 命名与 aegis_agent.self_update_binary_artifact_name() 一致，
# 供 release manifest 收录 + 冻结 agent 后台热更(sys.executable 自替换)取用。Linux 暂不做。
#
# 触发：手动(workflow_dispatch) + 打 tag(v*)。产物经 upload-artifact 取出，后续 Phase3/5 由
# 发布流程放进 public/downloads/ → aegis_release_build.py 收录 sha256 进 manifest → 部署直供。

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  freeze:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-13
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Freeze agent (--onefile, self-contained)
        run: |
          pyinstaller --onefile --name "aegis-agent-darwin-${{ matrix.arch }}" \
            --hidden-import aegis_self_update \
            --paths public/downloads \
            --distpath dist-bin --workpath build-bin --specpath build-bin \
            public/downloads/aegis_agent.py
      - name: Smoke test frozen binary (runs WITHOUT system python; finds sibling policy via BASE_DIR)
        run: |
          set -e
          mkdir -p /tmp/agempty /tmp/agout
          cp public/downloads/aegis-policy.json public/downloads/aegis-security-baseline.md dist-bin/
          BIN="dist-bin/aegis-agent-darwin-${{ matrix.arch }}"
          set +e; "$BIN" /tmp/agempty --policy dist-bin/aegis-policy.json --output /tmp/agout/report.json; rc=$?; set -e
          # 退出码 0=无高危 / 2=有 critical|high，均属正常完成
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then echo "smoke FAIL rc=$rc"; exit 1; fi
          python -c "import json;r=json.load(open('/tmp/agout/report.json'));assert r['schema']=='aegis.report/v1';assert r['policy_version'],'policy sibling not found';print('smoke OK: agent_version',r['agent_version'],'policy_version',r['policy_version'])"
      - name: Verify self-contained (no system libpython linkage) + arch
        run: |
          BIN="dist-bin/aegis-agent-darwin-${{ matrix.arch }}"
          if otool -L "$BIN" | grep -qi 'libpython\|Python.framework'; then echo "FAIL: links system python"; otool -L "$BIN"; exit 1; fi
          echo "self-contained OK"; file "$BIN"; ls -lh "$BIN"
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegis-agent-darwin-${{ matrix.arch }}
          path: dist-bin/aegis-agent-darwin-${{ matrix.arch }}
          if-no-files-found: error

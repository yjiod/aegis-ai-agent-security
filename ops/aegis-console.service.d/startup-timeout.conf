# Aegis Console 启动超时（随仓库交付：ops/aegis-console.service.d/startup-timeout.conf）
#
# 修复的结构性冲突（2026-09-26 生产实测定位）：
#   主单元的 ExecStartPost 是就绪轮询：60 轮 x (curl -m 5 + sleep 5) = 最坏 600s。
#   而 TimeoutStartSec 覆盖整个 start job（含 ExecStartPost），原值仅 360s
#   ⇒ 只要冷编译超过 360s，ExecStartPost 必然仍在循环中被 systemd 杀掉，
#      单元判 'timeout' 失败，再被 Restart=always 拉起从零重新编译。
#   注意 ExecStartPost 两个分支都 exit 0，它自身永不报错——唯一失败途径就是被 360s 截断。
#
#   实测吻合：第1次 10:54:06->11:00:06 恰 360s 被杀（白烧 15min11.808s CPU）；
#             第2次 11:00:11->11:06:09 = 358s，仅余 2 秒侥幸通过。
#
# 取值：900s = ExecStartPost 最坏 600s + 300s 余量。
[Service]
TimeoutStartSec=900

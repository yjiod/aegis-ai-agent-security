# Aegis Console 资源上限（随仓库交付：ops/aegis-console.service.d/limits.conf）
#
# 2026-09-26 MemoryHigh 1600M -> 2000M 的依据：
#   实测冷编译（vinext/wrangler 首次编译 /login）内存峰值 1.5G，已抵到原软限 1600M
#   ⇒ 编译期被 cgroup 节流（throttle），这很可能是冷编译耗时达 358s、
#      远超脚本注释所称 150-310s 的主因。抬到 2000M 以解除节流。
#   MemoryMax=2400M 保持不变（硬限，防单机 OOM 扩散）；2000M < 2400M 仍安全。
#   实测 MemAvailable 全程 1551-2053MB，抬升软限不会挤垮系统。
[Service]
MemoryHigh=2000M
MemoryMax=2400M

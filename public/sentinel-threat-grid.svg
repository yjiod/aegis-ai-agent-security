  <g fill="#9BBAC5" fill-opacity="0.4">
    <circle cx="160" cy="64" r="1.5"/><circle cx="215" cy="260" r="1.5"/><circle cx="410" cy="238" r="1.5"/>
    <circle cx="600" cy="54" r="1.5"/><circle cx="772" cy="256" r="1.5"/><circle cx="844" cy="204" r="1.5"/>

      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="960" height="320" rx="10" fill="url(#grid-bg)"/>
  <rect x="1" y="1" width="958" height="318" rx="9" fill="url(#grid)" stroke="#5BA6B8" stroke-opacity="0.24"/>

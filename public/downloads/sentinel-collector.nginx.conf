# Load inside nginx's http {} context after replacing the certificate paths and
# server_name. Keep the Python collector bound to loopback only.
limit_req_zone $binary_remote_addr zone=sentinel_reports:10m rate=120r/m;

server {
    listen 443 ssl http2;
    server_name sentinel-collector.example.internal;

    ssl_certificate /etc/pki/tls/certs/sentinel-collector.crt;
    ssl_certificate_key /etc/pki/tls/private/sentinel-collector.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    client_max_body_size 2m;
    client_body_timeout 15s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;

    location = /health {
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
    }

    location /v1/ {
        limit_req zone=sentinel_reports burst=30 nodelay;
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    location / {
        return 404;
    }
}
